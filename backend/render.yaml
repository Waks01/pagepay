services:
  - type: web
    name: pagepay-backend
    env: python
    plan: free
    buildCommand: export CARGO_HOME=/tmp/cargo XDG_CACHE_HOME=/tmp/cargo-cache && pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    envVars:
      - key: DATABASE_URL
        fromDatabase: pagepay_db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pagepay-fff6.onrender.com
      - key: ADMIN_TOKEN
        value: dev-admin-token
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://pagepay-fff6.onrender.com
      - key: ADMOB_APP_ID_ANDROID
        value: ca-app-pub-3898064484524772~6521009021
      - key: ADMOB_APP_ID_IOS
        value: ca-app-pub-3898064484524772~4871553842
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: dcr5v9f3c
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Cloudflare R2 - durable storage for paid study audio. Reuses the
      # CLOUDFLARE_* S3 credentials already configured for Workers AI;
      # Render's filesystem is ephemeral so audio must not go to /tmp.
      # Bucket name defaults to pagepay-audio in config.py.
      - key: CLOUDFLARE_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_S3_API_ENDPOINT
        value: ""
      # Optional: override only if you use a different bucket name.
      - key: CLOUDFLARE_R2_BUCKET
        value: pagepay
      # Optional: set only if the bucket is public and you want to serve
      # files straight from the R2 CDN instead of via presigned URLs.
      - key: CLOUDFLARE_R2_PUBLIC_URL
        value: ""
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false

    databases:
      - name: pagepay_db
        engine: postgres
        version: '18'
        plan: free


