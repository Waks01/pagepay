services:
  - type: web
    name: pagepay-backend
    env: python
    plan: free
    # `pip install` runs FIRST so the build cannot fail over the
    # optional Tesseract step below. Tesseract only locates prose on
    # scanned pages so their diagrams can be separated from the text;
    # without it the app still works, and a scanned page is kept as one
    # whole figure, which loses nothing.
    buildCommand: export CARGO_HOME=/tmp/cargo XDG_CACHE_HOME=/tmp/cargo-cache && pip install -r requirements.txt && (sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng || apt-get update && apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng || true)
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    envVars:
      - key: DATABASE_URL
        fromDatabase: pagepay_db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pagepay-fff6.onrender.com
      - key: ADMIN_TOKEN
        value: dev-admin-token
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://pagepay-fff6.onrender.com
      - key: ADMOB_APP_ID_ANDROID
        value: ca-app-pub-3898064484524772~6521009021
      - key: ADMOB_APP_ID_IOS
        value: ca-app-pub-3898064484524772~4871553842
      # Still used by the task-submission verifier
      # (app/services/ai_verification.py). Text generation itself runs
      # on Cloudflare Workers AI via CLOUDFLARE_ACCOUNT_ID /
      # CLOUDFLARE_API_TOKEN below.
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: dcr5v9f3c
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Cloudflare R2 - durable storage for paid study audio, and for the
      # rendered pages and cropped diagrams of an uploaded material.
      # Reuses the CLOUDFLARE_* S3 credentials already configured for
      # Workers AI; Render's filesystem is ephemeral so nothing may go
      # to /tmp.
      - key: CLOUDFLARE_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_SECRET_ACCESS_KEY
        sync: false
      # The R2 S3 endpoint is derived from the account id. It MUST be a
      # real value: `is_configured()` treats an empty endpoint as "R2
      # is off", and the audio generator then fails every episode.
      - key: CLOUDFLARE_S3_API_ENDPOINT
        value: https://90ccf47e58be8350eb7c5d59bd7790ae.r2.cloudflarestorage.com
      # Optional: override only if you use a different bucket name.
      - key: CLOUDFLARE_R2_BUCKET
        value: pagepay
      # Set this to the bucket's public URL (the r2.dev domain, or a
      # custom domain) so page images and diagrams are served from a
      # stable CDN link. Left unset, every URL handed to the app is a
      # presigned link that expires after an hour — a student who opens
      # a material tomorrow sees broken pictures.
      # No `value:` here on purpose: an empty value would override
      # whatever is set in the Render dashboard.
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false
      # Workers AI — every AI call in the app goes through this.
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      # Tesseract locates prose on scanned pages so the diagrams on them
      # can be separated from the text. It is never used to read the
      # material — the vision model does that. If the build image cannot
      # install it, the app still works: a scanned page is then kept as
      # a single whole figure, which loses nothing.
      - key: TESSERACT_ENABLED
        value: "true"

    databases:
      - name: pagepay_db
        engine: postgres
        version: '18'
        plan: free


