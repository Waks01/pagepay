<!DOCTYPE html>
<html lang="en" data-scheme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PagePay — Pick a theme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    .theme-pick {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--s6);
    }
    .step-dots {
      display: flex;
      justify-content: center;
      gap: var(--s1);
      margin-bottom: var(--s7);
    }
    .step-dot {
      width: 24px;
      height: 4px;
      border-radius: 2px;
      background: var(--border-strong);
    }
    .step-dot.active { background: var(--mint); }
    .theme-tiles {
      display: flex;
      gap: var(--s3);
      margin-bottom: var(--s6);
    }
    .theme-tile {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: var(--r-card);
      padding: var(--s3);
      cursor: pointer;
      background: var(--card);
      text-align: center;
      transition: border-color 200ms ease, transform 200ms ease;
      position: relative;
    }
    .theme-tile:hover { transform: translateY(-2px); }
    .theme-tile.selected {
      border-color: var(--mint);
    }
    .theme-tile.selected::after {
      content: '✓';
      position: absolute;
      top: var(--s3);
      right: var(--s3);
      color: var(--mint);
      font-weight: 700;
      font-size: 18px;
    }
    .theme-tile .swatch {
      width: 100%;
      height: 84px;
      border-radius: var(--r-input);
      margin-bottom: var(--s3);
      border: 1px solid rgba(0,0,0,0.06);
      padding: var(--s3);
      text-align: left;
    }
    .theme-tile .swatch-row {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
    }
    .theme-tile .swatch-pill {
      flex: 1;
      height: 8px;
      border-radius: 4px;
    }
    .theme-tile .swatch-text {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 13px;
    }
    .theme-tile .name {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }
    .preview-card {
      margin-bottom: var(--s5);
      padding: var(--s5);
      border-radius: var(--r-card);
      border: 1.5px solid var(--border);
    }
    .preview-card .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      margin-bottom: var(--s2);
    }
    .preview-card .row-sample {
      display: flex;
      gap: var(--s3);
      align-items: center;
    }
    .preview-card .preview-cta {
      margin-top: var(--s4);
      padding: var(--s3);
      background: var(--mint);
      color: var(--mint-text);
      border-radius: var(--r-input);
      text-align: center;
      font-weight: 600;
      font-size: 14px;
    }
    .footer-note {
      margin-top: auto;
      padding-top: var(--s5);
      text-align: center;
      font-size: 13px;
      color: var(--ink-muted);
    }
  </style>
</head>
<body>
  <div class="theme-switch" role="tablist" aria-label="Theme">
    <button data-theme="light" class="active">Light</button>
    <button data-theme="dark">Dark</button>
    <button data-theme="sepia">Sepia</button>
  </div>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <div class="right">
        <span>●●●●</span>
        <span>Wi-Fi</span>
        <span>100%</span>
      </div>
    </div>

    <div class="screen no-tabbar">
      <div class="theme-pick">
        <div class="step-dots" aria-label="Step 2 of 3">
          <div class="step-dot"></div>
          <div class="step-dot active"></div>
          <div class="step-dot"></div>
        </div>

        <h1 class="display">Pick your reading vibe</h1>
        <p class="small" style="margin-bottom: var(--s6);">You can switch anytime from settings.</p>

        <div class="preview-card" id="preview">
          <div class="label">Preview</div>
          <div class="row-sample">
            <div style="width: 36px; height: 36px; border-radius: var(--r-pill); background: var(--mint); color: var(--mint-text); display: flex; align-items: center; justify-content: center; font-weight: 700;">P</div>
            <div>
              <div style="font-weight: 700;">Hello, reader</div>
              <div class="small">2 sv earned today</div>
            </div>
          </div>
          <div class="preview-cta">Continue reading</div>
        </div>

        <div class="theme-tiles">
          <div class="theme-tile selected" data-scheme="light">
            <div class="swatch" style="background: #FBFAF6; color: #0E1116;">
              <div class="swatch-row">
                <div class="swatch-pill" style="background: #0E7C66;"></div>
                <div class="swatch-pill" style="background: #6B7280;"></div>
              </div>
              <div class="swatch-text">Aa — Hello</div>
            </div>
            <div class="name" style="color: #0E1116;">Light</div>
          </div>

          <div class="theme-tile" data-scheme="dark">
            <div class="swatch" style="background: #0E1116; color: #FBFAF6;">
              <div class="swatch-row">
                <div class="swatch-pill" style="background: #34C39B;"></div>
                <div class="swatch-pill" style="background: #9BA1A6;"></div>
              </div>
              <div class="swatch-text" style="color: #FBFAF6;">Aa — Hello</div>
            </div>
            <div class="name" style="color: #0E1116;">Dark</div>
          </div>

          <div class="theme-tile" data-scheme="sepia">
            <div class="swatch" style="background: #F5ECD7; color: #3E2C1C;">
              <div class="swatch-row">
                <div class="swatch-pill" style="background: #7C5E2A;"></div>
                <div class="swatch-pill" style="background: #7A6650;"></div>
              </div>
              <div class="swatch-text" style="color: #3E2C1C;">Aa — Hello</div>
            </div>
            <div class="name" style="color: #0E1116;">Sepia</div>
          </div>
        </div>

        <a href="onboarding-notifications.html" class="btn btn-primary btn-full" style="margin-top: var(--s3);">Continue</a>

        <div class="footer-note">
          Try Sepia for long study sessions — easier on the eyes.
        </div>
      </div>
    </div>
  </div>

  <script>
    const switcher = document.querySelector('.theme-switch');
    const tiles = document.querySelectorAll('.theme-tile');
    const setScheme = (scheme) => {
      document.documentElement.dataset.scheme = scheme;
      switcher.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.theme === scheme));
      tiles.forEach(t => t.classList.toggle('selected', t.dataset.scheme === scheme));
    };

    switcher.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => setScheme(btn.dataset.theme));
    });
    tiles.forEach(t => t.addEventListener('click', () => setScheme(t.dataset.scheme)));
  </script>
</body>
</html>
