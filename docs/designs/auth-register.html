<!DOCTYPE html>
<html lang="en" data-scheme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PagePay — Create account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    .register-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--s6);
    }
    .step-indicator {
      display: flex;
      gap: var(--s1);
      margin-bottom: var(--s6);
    }
    .step-indicator .bar {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
    }
    .step-indicator .bar.active { background: var(--mint); }
    .referral-banner {
      margin-bottom: var(--s5);
      padding: var(--s4);
      background: var(--mint-faint);
      border: 1px dashed var(--mint-soft);
      border-radius: var(--r-card);
      display: flex;
      gap: var(--s3);
      align-items: flex-start;
    }
    .referral-banner .gift {
      width: 36px;
      height: 36px;
      border-radius: var(--r-card);
      background: var(--mint);
      color: var(--mint-text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .referral-banner .text { font-size: 13px; line-height: 1.5; color: var(--ink); }
    .referral-banner .text strong { color: var(--mint); }
    .footer-cta {
      margin-top: auto;
      text-align: center;
      padding: var(--s5) 0 var(--s3);
      font-size: 14px;
      color: var(--ink-muted);
    }
    .footer-cta a { font-weight: 600; }
  </style>
</head>
<body>
  <div class="theme-switch" role="tablist" aria-label="Theme">
    <button data-theme="light" class="active">Light</button>
    <button data-theme="dark">Dark</button>
    <button data-theme="sepia">Sepia</button>
  </div>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <div class="right">
        <span>●●●●</span>
        <span>Wi-Fi</span>
        <span>100%</span>
      </div>
    </div>

    <div class="screen no-tabbar">
      <div class="register-wrap">
        <div class="step-indicator" aria-label="Step 1 of 2">
          <div class="bar active"></div>
          <div class="bar"></div>
        </div>

        <h1 class="display">Create your account</h1>
        <p class="small" style="margin-bottom: var(--s5);">Start earning service points and reading daily.</p>

        <div class="referral-banner">
          <div class="gift">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
          </div>
          <div class="text">
            New users get a <strong>100 sv</strong> welcome bonus to start reading & unlocking content.
          </div>
        </div>

        <div class="field">
          <label for="fullname">Full name</label>
          <div class="input-wrap">
            <input id="fullname" type="text" class="input" placeholder="Ada Lovelace">
          </div>
        </div>

        <div class="field">
          <label for="reg-email">Email</label>
          <div class="input-wrap">
            <input id="reg-email" type="email" class="input has-icon" placeholder="you@example.com" value="ada@pagepay.app">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
          </div>
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <div class="input-wrap">
            <input id="phone" type="tel" class="input has-icon" placeholder="080 0000 0000" value="0803 456 7890">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.33 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            </span>
          </div>
        </div>

        <div class="field">
          <label for="reg-password">Password</label>
          <div class="input-wrap">
            <input id="reg-password" type="password" class="input" placeholder="At least 8 characters" value="P@ssw0rd!">
            <button class="input-action" aria-label="Show password" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <div class="strength" id="strength-bars">
            <div class="strength-segment filled-strong"></div>
            <div class="strength-segment filled-strong"></div>
            <div class="strength-segment filled-mid"></div>
            <div class="strength-segment"></div>
          </div>
          <div class="strength-label strong" id="strength-label">Strong</div>
        </div>

        <div class="field">
          <label for="referral">Referral code (optional)</label>
          <div class="input-wrap">
            <input id="referral" type="text" class="input has-icon" placeholder="Enter code" value="ADA100">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
            </span>
          </div>
          <div class="field-hint">You and your friend both get <strong>500 sv</strong> when they earn their first 100 sv.</div>
        </div>

        <label class="check" style="margin-top: var(--s3); margin-bottom: var(--s5);">
          <input type="checkbox" checked>
          <div class="check-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <div class="check-text">
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
          </div>
        </label>

        <a href="auth-verify-email.html" class="btn btn-primary btn-full">Create account</a>

        <div class="footer-cta">
          Already have an account? <a href="auth-login.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const schemes = ['light', 'dark', 'sepia'];
    const switcher = document.querySelector('.theme-switch');
    switcher.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const scheme = btn.dataset.theme;
        document.documentElement.dataset.scheme = scheme;
        switcher.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      });
    });

    document.querySelector('.input-action')?.addEventListener('click', e => {
      const input = document.getElementById('reg-password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    // Live strength
    const pw = document.getElementById('reg-password');
    const bars = document.querySelectorAll('#strength-bars .strength-segment');
    const label = document.getElementById('strength-label');
    const updateStrength = (val) => {
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const classes = ['', 'filled-weak', 'filled-weak', 'filled-mid', 'filled-strong'];
      const labelClasses = ['weak', 'weak', 'mid', 'mid', 'strong'];
      const labelText = ['', 'Too short', 'Weak', 'Good', 'Strong'];
      bars.forEach((b, i) => { b.className = 'strength-segment' + (i < score ? ' ' + classes[score] : ''); });
      label.className = 'strength-label ' + labelClasses[score];
      label.textContent = labelText[score];
    };
    pw?.addEventListener('input', e => updateStrength(e.target.value));
  </script>
</body>
</html>
