<!DOCTYPE html>
<html lang="en" data-scheme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PagePay — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    .login-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--s6);
    }
    .brand {
      text-align: center;
      padding: var(--s7) 0 var(--s9);
    }
    .brand-mark {
      width: 64px;
      height: 64px;
      border-radius: var(--r-card);
      background: var(--mint);
      color: var(--mint-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 28px;
      margin-bottom: var(--s4);
      box-shadow: var(--shadow);
    }
    .brand-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .brand-tag {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--ink-muted);
      font-size: 14px;
      margin-top: var(--s1);
    }
    .form-stack {
      display: flex;
      flex-direction: column;
      gap: var(--s2);
    }
    .forgot-link {
      align-self: flex-end;
      font-size: 13px;
      font-weight: 600;
      color: var(--mint);
      margin-top: -8px;
      margin-bottom: var(--s4);
    }
    .divider {
      display: flex;
      align-items: center;
      gap: var(--s3);
      margin: var(--s6) 0;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .oauth-row {
      display: flex;
      gap: var(--s3);
      margin-bottom: var(--s5);
    }
    .oauth-btn {
      flex: 1;
      padding: var(--s4);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--s2);
      cursor: pointer;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 14px;
      color: var(--ink);
    }
    .footer-cta {
      margin-top: auto;
      text-align: center;
      padding: var(--s5);
      font-size: 14px;
      color: var(--ink-muted);
    }
    .footer-cta a { font-weight: 600; }
  </style>
</head>
<body>
  <div class="theme-switch" role="tablist" aria-label="Theme">
    <button data-theme="light" class="active">Light</button>
    <button data-theme="dark">Dark</button>
    <button data-theme="sepia">Sepia</button>
  </div>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <div class="right">
        <span>●●●●</span>
        <span>Wi-Fi</span>
        <span>100%</span>
      </div>
    </div>

    <div class="screen no-tabbar">
      <div class="login-wrap">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div class="brand-name">PagePay</div>
          <div class="brand-tag">Read. Earn. Learn.</div>
        </div>

        <h1 class="display">Welcome back</h1>
        <p class="small" style="margin-bottom: var(--s6);">Sign in to continue your reading streak.</p>

        <div class="form-stack">
          <div class="field">
            <label for="email">Email or phone</label>
            <div class="input-wrap">
              <input id="email" type="text" class="input has-icon" placeholder="you@example.com" value="ada@pagepay.app">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </span>
            </div>
          </div>

          <div class="field" style="margin-bottom: 0;">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input id="password" type="password" class="input has-icon" placeholder="••••••••" value="password">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <button class="input-action" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <a href="auth-forgot-password.html" class="forgot-link">Forgot password?</a>

          <a href="home-main.html" class="btn btn-primary btn-full" style="margin-top: var(--s3);">Sign in</a>
        </div>

        <div class="divider"><span>or continue with</span></div>

        <div class="oauth-row">
          <button class="oauth-btn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          <button class="oauth-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.448 2.235-1.245 3.04-.81.81-1.965 1.43-3.04 1.43-.135-1.125.42-2.265 1.215-3.06.81-.81 1.95-1.395 3.07-1.41zM21.57 17.39c-.72 1.65-1.05 2.385-1.965 3.84-1.275 2.025-3.075 4.545-5.31 4.56-1.965.015-2.475-1.275-5.145-1.26-2.67.015-3.225 1.275-5.19 1.26-2.235-.015-3.945-2.31-5.22-4.335C-.07 17.16-.31 10.815 1.875 7.665c1.545-2.235 3.99-3.54 6.285-3.54 2.325 0 3.795 1.275 5.73 1.275 1.875 0 3.015-1.275 5.7-1.275 2.04 0 4.2 1.11 5.745 3.03-5.055 2.775-4.23 9.99-.765 10.235z"/></svg>
            Apple
          </button>
        </div>

        <div class="footer-cta">
          Don't have an account? <a href="auth-register.html">Sign up</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const schemes = ['light', 'dark', 'sepia'];
    const switcher = document.querySelector('.theme-switch');
    switcher.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const scheme = btn.dataset.theme;
        document.documentElement.dataset.scheme = scheme;
        switcher.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      });
    });

    // Password show/hide
    document.querySelector('.input-action')?.addEventListener('click', e => {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
