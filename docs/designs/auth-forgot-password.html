<!DOCTYPE html>
<html lang="en" data-scheme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PagePay — Forgot password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    .forgot-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--s6);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--s7);
    }
    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--r-pill);
      background: var(--paper-2);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
    }
    .forgot-illu {
      width: 96px;
      height: 96px;
      border-radius: var(--r-pill);
      background: var(--paper-2);
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--s6);
      border: 1px dashed var(--border-strong);
    }
    .footer-link {
      margin-top: auto;
      text-align: center;
      padding-top: var(--s5);
    }
    .footer-link a {
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="theme-switch" role="tablist" aria-label="Theme">
    <button data-theme="light" class="active">Light</button>
    <button data-theme="dark">Dark</button>
    <button data-theme="sepia">Sepia</button>
  </div>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <div class="right">
        <span>●●●●</span>
        <span>Wi-Fi</span>
        <span>100%</span>
      </div>
    </div>

    <div class="screen no-tabbar">
      <div class="forgot-wrap">
        <div class="header-row">
          <a href="auth-login.html" class="back-btn" aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </a>
          <span></span>
        </div>

        <div class="forgot-illu">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </div>

        <h1 class="display" style="text-align: center;">Forgot password?</h1>
        <p class="small" style="text-align: center; margin-bottom: var(--s7);">
          No worries. Enter the email or phone tied to your account and we'll send you a reset link.
        </p>

        <div class="field">
          <label for="recover">Email or phone</label>
          <div class="input-wrap">
            <input id="recover" type="text" class="input has-icon" placeholder="you@example.com" value="ada@pagepay.app">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
          </div>
        </div>

        <div class="field">
          <label for="method">Send code via</label>
          <div style="display: flex; gap: var(--s3);">
            <div class="plan-row selected" style="flex: 1; margin-bottom: 0;">
              <div>
                <div class="name">Email</div>
                <div class="desc">a•••@pagepay.app</div>
              </div>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--mint)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="plan-row" style="flex: 1; margin-bottom: 0;">
              <div>
                <div class="name">SMS</div>
                <div class="desc">0803 ••• 7890</div>
              </div>
            </div>
          </div>
        </div>

        <a href="auth-verify-email.html" class="btn btn-primary btn-full" style="margin-top: var(--s5);">Send reset link</a>

        <div class="footer-link">
          Remembered it? <a href="auth-login.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const switcher = document.querySelector('.theme-switch');
    switcher.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.documentElement.dataset.scheme = btn.dataset.theme;
        switcher.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      });
    });
  </script>
</body>
</html>
