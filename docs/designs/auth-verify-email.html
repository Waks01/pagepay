<!DOCTYPE html>
<html lang="en" data-scheme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PagePay — Verify email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    .verify-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--s6);
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--s7);
    }
    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--r-pill);
      background: var(--paper-2);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
    }
    .verify-illu {
      width: 96px;
      height: 96px;
      border-radius: var(--r-pill);
      background: var(--mint-soft);
      color: var(--mint);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--s6);
    }
    .verify-illu.error {
      background: var(--signal-soft);
      color: var(--signal);
    }
    .email-line {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--mint);
    }
    .otp-row {
      display: flex;
      gap: var(--s3);
      justify-content: center;
      margin: var(--s7) 0 var(--s3);
    }
    .otp-cell {
      width: 52px;
      height: 64px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--r-input);
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
      transition: border-color 160ms ease;
    }
    .otp-cell:focus {
      outline: none;
      border-color: var(--mint);
      box-shadow: 0 0 0 3px var(--mint-faint);
    }
    .otp-cell.filled {
      border-color: var(--mint);
      background: var(--mint-faint);
    }
    .otp-cell.error {
      border-color: var(--signal);
      animation: shake 320ms ease;
    }
    .resend-row {
      text-align: center;
      font-size: 14px;
      color: var(--ink-muted);
      margin-bottom: var(--s7);
    }
    .resend-row a {
      font-weight: 600;
      color: var(--mint);
      text-decoration: none;
    }
    .resend-row .timer { color: var(--ink-faint); }
  </style>
</head>
<body>
  <div class="theme-switch" role="tablist" aria-label="Theme">
    <button data-theme="light" class="active">Light</button>
    <button data-theme="dark">Dark</button>
    <button data-theme="sepia">Sepia</button>
  </div>

  <div class="phone">
    <div class="status-bar">
      <span>9:41</span>
      <div class="right">
        <span>●●●●</span>
        <span>Wi-Fi</span>
        <span>100%</span>
      </div>
    </div>

    <div class="screen no-tabbar">
      <div class="verify-wrap">
        <div class="header-row">
          <button class="back-btn" aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <button class="btn btn-ghost" style="font-size: 13px;">Skip for now</button>
        </div>

        <div class="verify-illu">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </div>

        <h1 class="display" style="text-align: center;">Verify your email</h1>
        <p class="small" style="text-align: center; margin-bottom: 0;">
          We sent a 6-digit code to <span class="email-line">a•••@pagepay.app</span>.<br>
          Enter it below to confirm your account.
        </p>

        <form id="otp-form">
          <div class="otp-row" id="otp-row">
            <input class="otp-cell filled" inputmode="numeric" maxlength="1" value="4" aria-label="Digit 1">
            <input class="otp-cell filled" inputmode="numeric" maxlength="1" value="2" aria-label="Digit 2">
            <input class="otp-cell filled" inputmode="numeric" maxlength="1" value="9" aria-label="Digit 3">
            <input class="otp-cell filled" inputmode="numeric" maxlength="1" value="1" aria-label="Digit 4">
            <input class="otp-cell" inputmode="numeric" maxlength="1" aria-label="Digit 5" autofocus>
            <input class="otp-cell" inputmode="numeric" maxlength="1" aria-label="Digit 6">
          </div>
        </form>

        <div class="resend-row">
          Didn't get the code? <a href="#">Resend</a> <span class="timer">in 0:42</span>
        </div>

        <a href="onboarding-welcome.html" class="btn btn-primary btn-full" style="margin-top: auto;">Verify & continue</a>
      </div>
    </div>
  </div>

  <script>
    const switcher = document.querySelector('.theme-switch');
    switcher.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.documentElement.dataset.scheme = btn.dataset.theme;
        switcher.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      });
    });

    // OTP auto-advance
    const cells = document.querySelectorAll('.otp-cell');
    cells.forEach((cell, i) => {
      cell.addEventListener('input', e => {
        const v = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = v;
        if (v && i < cells.length - 1) cells[i + 1].focus();
        e.target.classList.toggle('filled', !!v);
      });
      cell.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) {
          cells[i - 1].focus();
        }
      });
      cell.addEventListener('paste', e => {
        e.preventDefault();
        const pasted = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, 6);
        pasted.split('').forEach((d, idx) => {
          if (cells[idx]) {
            cells[idx].value = d;
            cells[idx].classList.add('filled');
          }
        });
        cells[Math.min(pasted.length, 5)].focus();
      });
    });
  </script>
</body>
</html>
